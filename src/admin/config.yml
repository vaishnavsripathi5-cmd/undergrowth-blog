backend:
  name: github
  repo: vaishnavsripathi5-cmd/undergrowth-blog
  branch: main
  base_url: https://decap-oauth-proxy.vaishnavsripathi5.workers.dev
  auth_endpoint: auth

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Field Stories"
    label_singular: "Field Story"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: title

    fields:
      - { label: "Title", name: "title", widget: "string" }

      - { label: "Type", name: "type", widget: "select", options: ["Journal", "Expedition"], default: "Journal" }

      - { label: "Date", name: "date", widget: "datetime", default: "" }

      - { label: "Location", name: "location", widget: "string" }

      - { label: "Coordinates", name: "coords", widget: "string", required: false }

      - { label: "Short excerpt", name: "excerpt", widget: "text" }

      - { label: "Cover photo", name: "image", widget: "image", required: false }

      - { label: "Gallery", name: "gallery", widget: "list", required: false, field: { label: "Photo", name: "photo", widget: "image" } }

      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }

      - { label: "Story", name: "body", widget: "markdown" }

  - name: "about"
    label: "About / Who I Am"
    files:
      - file: "src/_data/about.json"
        label: "About Section"
        name: "about"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }

          - { label: "Bio", name: "bio", widget: "text" }

          - { label: "Profile Photo", name: "image", widget: "image", required: false }
