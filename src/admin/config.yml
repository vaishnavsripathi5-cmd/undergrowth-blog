backend:
  name: git-gateway
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Journal Entries"
    label_singular: "Entry"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", default: "" }
      - { label: "Location (place name)", name: "location", widget: "string" }
      - { label: "Coordinates (optional, e.g. 34.15° N, 77.57° E)", name: "coords", widget: "string", required: false }
      - { label: "Short excerpt (shown on the homepage)", name: "excerpt", widget: "text" }
      - { label: "Cover photo", name: "image", widget: "image", required: false }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Story", name: "body", widget: "markdown" }
